name: WithingsHealthBridge
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.2.5
    GENERATE_INFOPLIST_FILE: YES
targets:
  WithingsHealthBridge:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Artwork/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.withingshealthbridge.iOS
        INFOPLIST_KEY_CFBundleDisplayName: Health Bridge
        INFOPLIST_KEY_NSHealthShareUsageDescription: Match bridge measurements against existing Apple Health entries to avoid duplicates.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Save your verified Withings-device measurements to Apple Health.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: iOS/WithingsHealthBridge.entitlements
        TARGETED_DEVICE_FAMILY: '1'
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.HealthKit:
          enabled: 1

schemes:
  WithingsHealthBridge:
    build:
      targets:
        WithingsHealthBridge: all
    run:
      config: Debug
    archive:
      config: Release
