name: Build Windows Bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install local-only runtime dependencies
        run: python -m pip install -r Windows/requirements.txt
      - name: Test backup processing and exchange compatibility
        env:
          PYTHONPATH: Windows
        run: python -m unittest discover -s Windows/tests -v
      - name: Package Windows application and verify startup
        shell: powershell
        run: ./Windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: WithingsHealthBridge-Windows-0.1.0-x64
          path: Windows/dist/WithingsHealthBridge-Windows-0.1.0-x64.zip
          if-no-files-found: error
          retention-days: 30
